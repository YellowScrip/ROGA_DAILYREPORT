<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ROGA 每日工作汇报系统</title>

<style>
:root {
    --primary: #0f3d5e;
    --primary-light: #1c6b9e;
    --accent: #f4b942;
    --bg: #eef3f8;
    --card: rgba(255,255,255,0.82);
    --text: #1f2937;
    --muted: #6b7280;
    --danger: #ef4444;
    --success: #22c55e;
    --shadow: 0 20px 50px rgba(15, 61, 94, 0.16);
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background:
        radial-gradient(circle at top left, rgba(244,185,66,0.25), transparent 28%),
        radial-gradient(circle at top right, rgba(28,107,158,0.24), transparent 30%),
        linear-gradient(135deg, #edf4fb 0%, #f8fbff 50%, #eef3f8 100%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
}

.bg-orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(10px);
    opacity: 0.28;
    animation: floatOrb 12s ease-in-out infinite alternate;
    z-index: 0;
}

.orb1 {
    width: 280px;
    height: 280px;
    background: #1c6b9e;
    left: -90px;
    top: 120px;
}

.orb2 {
    width: 220px;
    height: 220px;
    background: #f4b942;
    right: -70px;
    bottom: 100px;
    animation-delay: 2s;
}

@keyframes floatOrb {
    from { transform: translateY(0) translateX(0) scale(1); }
    to { transform: translateY(-45px) translateX(35px) scale(1.08); }
}

.app {
    position: relative;
    z-index: 2;
    max-width: 1180px;
    margin: 0 auto;
    padding: 34px 24px 60px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    margin-bottom: 26px;
    animation: fadeDown 0.7s ease both;
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 16px;
}

.logo-mark {
    width: 70px;
    height: 70px;
    border-radius: 22px;
    background: linear-gradient(145deg, var(--primary), var(--primary-light));
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: 1px;
    box-shadow: 0 16px 36px rgba(15, 61, 94, 0.25);
    position: relative;
    overflow: hidden;
}

.logo-mark::after {
    content: "";
    position: absolute;
    width: 90px;
    height: 20px;
    background: rgba(255,255,255,0.35);
    transform: rotate(-35deg);
    top: -20px;
    left: -40px;
    animation: shine 4s infinite;
}

@keyframes shine {
    0% { transform: translateX(-80px) rotate(-35deg); }
    45%,100% { transform: translateX(140px) rotate(-35deg); }
}

.logo-text h1 {
    margin: 0;
    font-size: 30px;
    color: var(--primary);
    letter-spacing: 0.5px;
}

.logo-text p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.date-panel {
    background: rgba(255,255,255,0.72);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 22px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
    min-width: 320px;
}

.date-panel label {
    display: block;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 10px;
}

.date-switcher {
    display: grid;
    grid-template-columns: 42px 1fr 42px;
    gap: 10px;
    align-items: center;
}

.date-switcher button {
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, #0f3d5e, #1c6b9e);
    color: white;
    font-size: 18px;
    padding: 0;
}

.date-panel input {
    width: 100%;
    height: 42px;
    border: none;
    outline: none;
    font-size: 16px;
    color: var(--primary);
    background: rgba(255,255,255,0.68);
    font-weight: 700;
    border-radius: 14px;
    padding: 0 12px;
    text-align: center;
}

.current-day-text {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
}

.summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 26px;
    animation: fadeUp 0.8s ease both;
}

.summary-card {
    background: var(--card);
    border: 1px solid rgba(255,255,255,0.75);
    backdrop-filter: blur(18px);
    border-radius: 24px;
    padding: 22px;
    box-shadow: var(--shadow);
    transition: 0.3s ease;
    position: relative;
    overflow: hidden;
}

.summary-card::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(244,185,66,0.12), transparent 55%);
    opacity: 0;
    transition: 0.3s;
}

.summary-card:hover {
    transform: translateY(-6px);
}

.summary-card:hover::before {
    opacity: 1;
}

.summary-card .label {
    color: var(--muted);
    font-size: 13px;
}

.summary-card .value {
    margin-top: 10px;
    font-size: 30px;
    font-weight: 900;
    color: var(--primary);
}

.main-card {
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 30px;
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: fadeUp 1s ease both;
}

.toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 22px 26px;
    background: linear-gradient(135deg, rgba(15,61,94,0.96), rgba(28,107,158,0.92));
    color: white;
}

.toolbar h2 {
    margin: 0;
    font-size: 22px;
}

.toolbar p {
    margin: 5px 0 0;
    font-size: 13px;
    opacity: 0.82;
}

.btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

button {
    border: none;
    cursor: pointer;
    border-radius: 14px;
    padding: 11px 15px;
    font-weight: 700;
    transition: 0.25s ease;
    font-family: inherit;
}

button:hover {
    transform: translateY(-2px);
}

.btn-light {
    background: rgba(255,255,255,0.92);
    color: var(--primary);
}

.btn-gold {
    background: linear-gradient(135deg, #f4b942, #ffd978);
    color: #4b3410;
}

.btn-blue {
    background: linear-gradient(135deg, #1c6b9e, #0f3d5e);
    color: white;
}

.btn-danger {
    background: #fee2e2;
    color: #b91c1c;
}

.content {
    padding: 26px;
}

.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 2fr;
    gap: 16px;
    margin-bottom: 26px;
}

.field {
    background: rgba(255,255,255,0.7);
    border: 1px solid rgba(15,61,94,0.08);
    border-radius: 18px;
    padding: 14px 16px;
}

.field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
}

.field input,
.field textarea,
.task-input,
.task-result {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    color: var(--text);
    font-size: 15px;
}

.field textarea {
    resize: vertical;
    min-height: 42px;
}

.daily-section {
    margin-bottom: 26px;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid rgba(15,61,94,0.08);
    background: rgba(255,255,255,0.62);
}

.daily-section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    background: linear-gradient(135deg, rgba(15,61,94,0.08), rgba(244,185,66,0.12));
}

.daily-title h3 {
    margin: 0;
    color: var(--primary);
    font-size: 19px;
}

.daily-title p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 13px;
}

.badge {
    padding: 6px 11px;
    border-radius: 999px;
    background: rgba(15,61,94,0.1);
    color: var(--primary);
    font-size: 12px;
    font-weight: 800;
}

.task-list {
    padding: 16px;
}

.task-item {
    display: grid;
    grid-template-columns: 46px 1.35fr 1fr 120px 86px;
    gap: 12px;
    align-items: center;
    background: white;
    border-radius: 18px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 8px 24px rgba(15,61,94,0.08);
    animation: taskIn 0.28s ease both;
    border: 1px solid rgba(15,61,94,0.06);
}

@keyframes taskIn {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

.status {
    width: 34px;
    height: 34px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    background: #f3f4f6;
    cursor: pointer;
    transition: 0.25s;
}

.status.done {
    background: #dcfce7;
    color: #15803d;
}

.status.pending {
    background: #fee2e2;
    color: #b91c1c;
}

.task-input,
.task-result {
    border-bottom: 1px solid rgba(15,61,94,0.12);
    padding: 8px 4px;
}

.priority {
    border: none;
    outline: none;
    padding: 10px;
    border-radius: 12px;
    background: #f3f7fb;
    color: var(--primary);
    font-weight: 700;
}

.empty {
    padding: 32px 20px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
}

.footer-note {
    margin-top: 26px;
    padding: 18px;
    border-radius: 20px;
    background: rgba(15,61,94,0.06);
    color: var(--muted);
    font-size: 14px;
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-16px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
    .header,
    .toolbar {
        flex-direction: column;
        align-items: flex-start;
    }

    .summary-grid,
    .info-grid {
        grid-template-columns: 1fr;
    }

    .date-panel {
        width: 100%;
        min-width: auto;
    }

    .task-item {
        grid-template-columns: 40px 1fr;
    }

    .priority,
    .task-result,
    .btn-danger {
        grid-column: span 2;
    }
}
</style>
</head>

<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div class="app">

    <div class="header">
        <div class="logo-area">
            <div class="logo-mark">ROGA</div>
            <div class="logo-text">
                <h1>ROGA 每日工作汇报系统</h1>
                <p>Daily Work Report Dashboard · 每日计划 · 左右翻页 · 当天导出</p>
            </div>
        </div>

        <div class="date-panel">
            <label>当前查看日期</label>
            <div class="date-switcher">
                <button onclick="changeDate(-1)" title="前一天">‹</button>
                <input type="date" id="reportDate">
                <button onclick="changeDate(1)" title="后一天">›</button>
            </div>
            <div class="current-day-text" id="dateText"></div>
        </div>
    </div>

    <div class="summary-grid">
        <div class="summary-card">
            <div class="label">当天任务数</div>
            <div class="value" id="totalCount">0</div>
        </div>
        <div class="summary-card">
            <div class="label">已完成</div>
            <div class="value" id="doneCount">0</div>
        </div>
        <div class="summary-card">
            <div class="label">进行中 / 待处理</div>
            <div class="value" id="pendingCount">0</div>
        </div>
        <div class="summary-card">
            <div class="label">当天完成率</div>
            <div class="value" id="rateCount">0%</div>
        </div>
    </div>

    <div class="main-card">
        <div class="toolbar">
            <div>
                <h2 id="mainTitle">今日工作内容</h2>
                <p>通过左右按钮快速切换日期，每一天的工作内容会独立保存。</p>
            </div>
            <div class="btn-group">
                <button class="btn-light" onclick="addTask()">＋ 添加当天任务</button>
                <button class="btn-gold" onclick="exportPremiumHtml()">导出当天高级 HTML</button>
                <button class="btn-blue" onclick="exportText()">导出当天 TXT</button>
            </div>
        </div>

        <div class="content">

            <div class="info-grid">
                <div class="field">
                    <label>汇报人</label>
                    <input id="reporter" placeholder="例如：Ying Jie" />
                </div>

                <div class="field">
                    <label>汇报对象</label>
                    <input id="boss" placeholder="例如：Valerie" />
                </div>

                <div class="field">
                    <label>当天核心总结</label>
                    <textarea id="summary" placeholder="例如：今日重点推进 ROGA 招生系统、内容运营、家长沟通、课程规划等工作。"></textarea>
                </div>
            </div>

            <div class="daily-section">
                <div class="daily-section-head">
                    <div class="daily-title">
                        <h3 id="dailySectionTitle">📌 当天工作计划表</h3>
                        <p id="dailySectionSubtitle">记录这一天所有需要完成和已经完成的事项。</p>
                    </div>
                    <div>
                        <span class="badge" id="dailyBadge">0/0 已完成</span>
                        <button class="btn-blue" onclick="addTask()" style="margin-left:10px;">添加</button>
                    </div>
                </div>

                <div class="task-list" id="taskList"></div>
            </div>

            <div class="footer-note">
                使用说明：左上方日期区域可以点击 ‹ / › 切换前一天或后一天；每一天的数据独立保存。点击 ✅ / ❌ 可以切换任务状态。导出按钮只导出当前日期的汇报内容。
            </div>

        </div>
    </div>
</div>

<script>
const STORAGE_KEY = "roga_daily_report_by_date_v2";

let appData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null") || {
    global: {
        reporter: "Ying Jie",
        boss: "Valerie"
    },
    reports: {}
};

let currentDate = getToday();

function getToday() {
    const today = new Date();
    return formatDate(today);
}

function formatDate(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth() + 1).padStart(2, "0");
    const d = String(dateObj.getDate()).padStart(2, "0");
    return `${y}-${m}-${d}`;
}

function getDateObject(dateStr) {
    const [y, m, d] = dateStr.split("-").map(Number);
    return new Date(y, m - 1, d);
}

function getCurrentReport() {
    if (!appData.reports[currentDate]) {
        appData.reports[currentDate] = {
            summary: "",
            tasks: []
        };
    }
    return appData.reports[currentDate];
}

function save() {
    appData.global.reporter = document.getElementById("reporter").value;
    appData.global.boss = document.getElementById("boss").value;
    getCurrentReport().summary = document.getElementById("summary").value;

    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    updateStats();
}

function loadDate(dateStr) {
    currentDate = dateStr;
    getCurrentReport();

    document.getElementById("reportDate").value = currentDate;
    document.getElementById("reporter").value = appData.global.reporter || "";
    document.getElementById("boss").value = appData.global.boss || "";
    document.getElementById("summary").value = getCurrentReport().summary || "";

    updateDateText();
    renderTasks();
    save();
}

function updateDateText() {
    const dateObj = getDateObject(currentDate);
    const weekMap = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    const week = weekMap[dateObj.getDay()];

    document.getElementById("dateText").textContent = `${currentDate} · ${week}`;
    document.getElementById("mainTitle").textContent = `${currentDate} 工作内容`;
    document.getElementById("dailySectionTitle").textContent = `📌 ${currentDate} 工作计划表`;
}

function changeDate(offset) {
    save();

    const dateObj = getDateObject(currentDate);
    dateObj.setDate(dateObj.getDate() + offset);

    loadDate(formatDate(dateObj));
}

function addTask() {
    const report = getCurrentReport();

    report.tasks.push({
        text: "",
        result: "",
        priority: "中",
        done: false
    });

    save();
    renderTasks();
}

function deleteTask(index) {
    const report = getCurrentReport();
    report.tasks.splice(index, 1);

    save();
    renderTasks();
}

function toggleTask(index) {
    const report = getCurrentReport();
    report.tasks[index].done = !report.tasks[index].done;

    save();
    renderTasks();
}

function updateTask(index, field, value) {
    const report = getCurrentReport();
    report.tasks[index][field] = value;

    save();
}

function renderTasks() {
    const list = document.getElementById("taskList");
    const report = getCurrentReport();
    list.innerHTML = "";

    if (report.tasks.length === 0) {
        list.innerHTML = `<div class="empty">当天暂无任务。点击“添加当天任务”开始记录。</div>`;
    } else {
        report.tasks.forEach((task, index) => {
            const item = document.createElement("div");
            item.className = "task-item";

            item.innerHTML = `
                <div class="status ${task.done ? "done" : "pending"}" onclick="toggleTask(${index})">
                    ${task.done ? "✅" : "❌"}
                </div>

                <input class="task-input"
                    value="${escapeHtml(task.text)}"
                    placeholder="填写当天工作内容，例如：整理 ROGA 招生系统页面结构"
                    oninput="updateTask(${index}, 'text', this.value)" />

                <input class="task-result"
                    value="${escapeHtml(task.result)}"
                    placeholder="填写成果说明，例如：完成首页模块与数据面板设计"
                    oninput="updateTask(${index}, 'result', this.value)" />

                <select class="priority" onchange="updateTask(${index}, 'priority', this.value)">
                    <option value="高" ${task.priority === "高" ? "selected" : ""}>高优先级</option>
                    <option value="中" ${task.priority === "中" ? "selected" : ""}>中优先级</option>
                    <option value="低" ${task.priority === "低" ? "selected" : ""}>低优先级</option>
                </select>

                <button class="btn-danger" onclick="deleteTask(${index})">删除</button>
            `;

            list.appendChild(item);
        });
    }

    updateStats();
}

function updateStats() {
    const report = getCurrentReport();
    const total = report.tasks.length;
    const done = report.tasks.filter(t => t.done).length;
    const pending = total - done;
    const rate = total === 0 ? 0 : Math.round(done / total * 100);

    document.getElementById("totalCount").textContent = total;
    document.getElementById("doneCount").textContent = done;
    document.getElementById("pendingCount").textContent = pending;
    document.getElementById("rateCount").textContent = rate + "%";
    document.getElementById("dailyBadge").textContent = `${done}/${total} 已完成`;
}

function exportText() {
    save();

    const report = getCurrentReport();

    let text = "";
    text += `ROGA 每日工作汇报\n`;
    text += `日期：${currentDate}\n`;
    text += `汇报人：${appData.global.reporter || "未填写"}\n`;
    text += `汇报对象：${appData.global.boss || "未填写"}\n\n`;
    text += `当天核心总结：\n${report.summary || "暂无"}\n\n`;
    text += `【当天工作内容】\n`;

    if (report.tasks.length === 0) {
        text += `暂无任务记录\n`;
    } else {
        report.tasks.forEach((task, i) => {
            text += `${i + 1}. ${task.done ? "✅ 已完成" : "❌ 未完成"}｜${task.priority}优先级\n`;
            text += `工作内容：${task.text || "未填写"}\n`;
            text += `成果说明：${task.result || "未填写"}\n\n`;
        });
    }

    downloadFile(text, `ROGA_每日工作汇报_${currentDate}.txt`, "text/plain;charset=utf-8");
}

function exportPremiumHtml() {
    save();

    const report = getCurrentReport();
    const total = report.tasks.length;
    const done = report.tasks.filter(t => t.done).length;
    const pending = total - done;
    const rate = total === 0 ? 0 : Math.round(done / total * 100);

    let taskHtml = "";

    if (report.tasks.length === 0) {
        taskHtml = `<p class="empty-export">暂无任务记录</p>`;
    } else {
        report.tasks.forEach((task, i) => {
            taskHtml += `
            <div class="export-task">
                <div class="export-task-top">
                    <strong>${i + 1}. ${escapeHtml(task.text || "未填写工作内容")}</strong>
                    <span class="${task.done ? "done" : "pending"}">${task.done ? "已完成" : "未完成"}</span>
                </div>
                <p><b>成果说明：</b>${escapeHtml(task.result || "未填写")}</p>
                <p><b>优先级：</b>${escapeHtml(task.priority || "中")}</p>
            </div>
            `;
        });
    }

    const html = `
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>ROGA 每日工作汇报 ${currentDate}</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background: #eef3f8;
    color: #1f2937;
}
.report-page {
    max-width: 980px;
    margin: 40px auto;
    background: white;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 24px 70px rgba(15,61,94,0.18);
}
.report-cover {
    padding: 42px;
    color: white;
    background:

function downloadFile(content, filename, type) {
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}

function escapeHtml(str) {
    return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

});
